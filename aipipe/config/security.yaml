security:
  enabled: true
  prompt_injection:
    enabled: true
    action: block
  secrets:
    enabled: true
    action: redact
  pii:
    enabled: true
    action: redact
  input:
    max_characters: 100000
    max_tokens: 20000
  output:
    max_tokens: 4096
  agent:
    max_iterations: 10
  tools:
    require_permission: true
    allow_unknown: false
  mcp:
    require_permission: true
    allow_unknown_servers: false
    allow_unknown_tools: false
